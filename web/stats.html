<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战局分析 · 巢战</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workshop.css"><link rel="stylesheet" href="stats.css"><script type="module" src="stats.mjs"></script></head>
<body><div class="app-shell"><aside class="sidebar"><div class="sidebar-block brand"><h1>巢战</h1></div><nav class="sidebar-nav"><a class="nav-link" href="./#cards">卡牌工坊</a><a class="nav-link active" href="stats.html">战局分析</a></nav><section class="sidebar-block"><h2>客户端</h2><div id="downloads">正在读取版本</div></section></aside><main class="main-content"><header class="hero-banner"><h2>战局分析</h2><button id="export" class="secondary-button">导出 CSV</button></header><section class="surface filters"><label>时间<select id="days"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="90">近 90 天</option><option value="0">全部</option></select></label><label>样本<select id="samples"><option value="1">全部</option><option value="10">至少 10 局</option><option value="30">至少 30 局</option><option value="100">至少 100 局</option></select></label><label>类型<select id="kind"><option value="">全部</option><option value="unit">单位</option><option value="order">指令</option><option value="counter">反制</option></select></label><label>阵营<select id="faction"><option value="">全部</option></select></label><label>最少回合<input id="turns" type="number" value="0" min="0" max="10000"></label><label>卡牌<input id="search" placeholder="搜索名称"></label><button id="refresh" class="primary-button">刷新</button></section><p id="status" role="status"></p><section id="summary" class="summary-grid"></section><section class="surface"><div class="table-scroll"><table><thead><tr><th>卡牌 / 版本</th><th><button data-sort="games">携带局数 ↓</button></th><th><button data-sort="win_rate">携带胜率</button></th><th>95% 区间</th><th><button data-sort="drawn_win_rate">抽到后胜率</button></th><th><button data-sort="played_win_rate">打出后胜率</button></th><th>起手胜率</th><th>打出 / 抽取</th><th><button data-sort="damage_per_play">伤害 / 打出</button></th><th>击杀 / 阵亡</th><th>触发次数</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="card-detail" class="surface" hidden></section><details class="surface"><summary>统计口径</summary><div id="notes"></div><p>胜率区间使用 Wilson 95% 置信区间。样本较少时不宜据此调整卡牌。起手、抽到后和打出后胜率分别以满足该条件的玩家局数为分母；平局计入局数。双方携带同一张牌时计为两个携带样本。</p></details></main></div></body></html>
